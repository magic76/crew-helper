plugins {
    id 'com.android.application'
}

android {
    namespace 'com.crewpocket.helper'
    compileSdk 34

    defaultConfig {
        applicationId "com.crewpocket.helper"
        minSdk 24
        targetSdk 34

        // 0102: Crew Helper ships only to modern 64-bit ARM Android devices.
        // This prevents universal APKs from carrying unused x86/x86_64/armeabi-v7a
        // native Sherpa/Oboe libraries. Google Play AAB delivery remains compatible
        // with arm64-v8a devices.
        ndk {
            abiFilters 'arm64-v8a'
        }

        versionCode 134
        versionName "1.8.97"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.github.magic76:crew-agent-harness:v0.1.3'

    // Gemini Live transport. Keep the networking stack Gradle-managed so
    // OkHttp, Okio, and Kotlin runtime stay version-aligned instead of shipping
    // stale vendored JARs from app/libs.
    implementation platform('com.squareup.okhttp3:okhttp-bom:4.12.0')
    implementation 'com.squareup.okhttp3:okhttp'

    // Local binary dependency kept intentionally; network/Kotlin runtime jars
    // are excluded above and resolved from Maven Central instead.
    implementation fileTree(
            dir: 'libs',
            include: ['*.jar'],
            exclude: [
                    'sherpa-onnx-*.jar',
                    'kotlin-*.jar',
                    'annotations-*.jar',
                    'okhttp-*.jar',
                    'okio-*.jar'
            ])
    implementation files('libs/sherpa-onnx-1.13.7.aar')
}

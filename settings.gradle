pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup 'com.github.magic76'
            }
        }
    }
}
rootProject.name = "CrewHelper"
include ':app'
// Keep the in-repo module temporarily for rollback/tests while the app consumes
// the released shared artifact from crew-agent-harness through JitPack.
include ':agent-core'

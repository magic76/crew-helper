name: Temporary audio noise source patch

on:
  push:
    branches:
      - fix/gemini-live-noise-vad

permissions:
  contents: write

jobs:
  patch-native-live:
    if: ${{ !contains(github.event.head_commit.message, '[audio-patch-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused NativeGeminiLiveClient diagnostics and barge-in fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/crewpocket/helper/NativeGeminiLiveClient.java')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          def regex_once(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')

          replace_once(
              '    private android.media.audiofx.AcousticEchoCanceler aecEffect = null;\n'
              '    private android.media.audiofx.NoiseSuppressor nsEffect = null;\n'
              '    private volatile boolean agentMuted = false;',
              '    private android.media.audiofx.AcousticEchoCanceler aecEffect = null;\n'
              '    private android.media.audiofx.NoiseSuppressor nsEffect = null;\n'
              '    private volatile long serverInterruptedCount = 0L;\n'
              '    private volatile long bargeInAdmissionCount = 0L;\n'
              '    private volatile long lastBargeInAdmissionAt = 0L;\n'
              '    private volatile long audioTrackWriteFailureCount = 0L;\n'
              '    private volatile long audioTrackShortWriteCount = 0L;\n'
              '    private volatile long oboeWriteFailureCount = 0L;\n'
              '    private volatile boolean agentMuted = false;',
              'diagnostic counters')

          new_start = r'''    private void startAudio() {
              if (!running || recorder != null) return;
              int min = AudioRecord.getMinBufferSize(16000, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT);
              int bufferBytes = Math.max(min * 4, 8192);
              int selectedAudioSource = MediaRecorder.AudioSource.VOICE_COMMUNICATION;
              try {
                  recorder = new AudioRecord(selectedAudioSource, 16000,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT, bufferBytes);
                  if (recorder.getState() != AudioRecord.STATE_INITIALIZED) {
                      throw new IllegalStateException("VOICE_COMMUNICATION_NOT_INITIALIZED");
                  }
              } catch (Exception voiceError) {
                  Log.w(TAG, "0120 AudioRecord VOICE_COMMUNICATION unavailable: "
                          + voiceError.getClass().getSimpleName() + "; fallback=MIC");
                  try { if (recorder != null) recorder.release(); } catch (Exception ignored) {}
                  recorder = null;
                  selectedAudioSource = MediaRecorder.AudioSource.MIC;
                  recorder = new AudioRecord(selectedAudioSource, 16000,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT, bufferBytes);
              }

              if (recorder == null || recorder.getState() != AudioRecord.STATE_INITIALIZED) {
                  fail("麥克風初始化失敗", null);
                  return;
              }
              Log.i(TAG, "0120 AudioRecord source="
                      + (selectedAudioSource == MediaRecorder.AudioSource.VOICE_COMMUNICATION
                          ? "VOICE_COMMUNICATION" : "MIC")
                      + " state=" + recorder.getState()
                      + " session=" + recorder.getAudioSessionId()
                      + " bufferBytes=" + bufferBytes);

              boolean aecAvailable = android.media.audiofx.AcousticEchoCanceler.isAvailable();
              boolean aecCreated = false;
              int aecEnableStatus = Integer.MIN_VALUE;
              boolean aecEnabled = false;
              try {
                  if (aecAvailable) {
                      aecEffect = android.media.audiofx.AcousticEchoCanceler.create(
                              recorder.getAudioSessionId());
                      aecCreated = aecEffect != null;
                      if (aecEffect != null) {
                          aecEnableStatus = aecEffect.setEnabled(true);
                          aecEnabled = aecEffect.getEnabled();
                      }
                  }
              } catch (Exception effectError) {
                  Log.w(TAG, "0120 AEC setup exception="
                          + effectError.getClass().getSimpleName());
              }
              Log.i(TAG, "0120 AEC available=" + aecAvailable
                      + " created=" + aecCreated
                      + " enableStatus=" + aecEnableStatus
                      + " enabled=" + aecEnabled);

              boolean nsAvailable = android.media.audiofx.NoiseSuppressor.isAvailable();
              boolean nsCreated = false;
              int nsEnableStatus = Integer.MIN_VALUE;
              boolean nsEnabled = false;
              try {
                  if (nsAvailable) {
                      nsEffect = android.media.audiofx.NoiseSuppressor.create(
                              recorder.getAudioSessionId());
                      nsCreated = nsEffect != null;
                      if (nsEffect != null) {
                          nsEnableStatus = nsEffect.setEnabled(true);
                          nsEnabled = nsEffect.getEnabled();
                      }
                  }
              } catch (Exception effectError) {
                  Log.w(TAG, "0120 NoiseSuppressor setup exception="
                          + effectError.getClass().getSimpleName());
              }
              Log.i(TAG, "0120 NoiseSuppressor available=" + nsAvailable
                      + " created=" + nsCreated
                      + " enableStatus=" + nsEnableStatus
                      + " enabled=" + nsEnabled);

              createAudioPlayer();
              startPlaybackWorker();
              try {
                  recorder.startRecording();
                  Log.i(TAG, "0120 AudioRecord recordingState="
                          + recorder.getRecordingState());
              } catch (Exception startError) {
                  fail("麥克風啟動失敗：" + startError.getClass().getSimpleName(), startError);
                  return;
              }
              new Thread(new Runnable() { @Override public void run() { sendMic(); } }, "crew-native-live-mic").start();
          }'''
          regex_once(
              r'    private void startAudio\(\) \{.*?\n    \}\n\n    private void createAudioPlayer\(\) \{',
              new_start + '\n\n    private void createAudioPlayer() {',
              'startAudio method')

          replace_once(
              '        ActiveNoiseAdmissionGate activeNoiseGate =\n'
              '                new ActiveNoiseAdmissionGate(pcm.length);\n\n'
              '        while (running && recorder != null && webSocket != null) {',
              '        ActiveNoiseAdmissionGate activeNoiseGate =\n'
              '                new ActiveNoiseAdmissionGate(pcm.length);\n'
              '        long lastNoiseGateDiagnosticAt = 0L;\n\n'
              '        while (running && recorder != null && webSocket != null) {',
              'noise gate diagnostic clock')

          replace_once(
              '                double activeGateThreshold = Math.max(\n'
              '                        gateThreshold, activeNoiseGate.lastThreshold());\n\n'
              '                if (noiseAction == ActiveNoiseAdmissionGate.Action.SUPPRESS) {',
              '                double activeGateThreshold = Math.max(\n'
              '                        gateThreshold, activeNoiseGate.lastThreshold());\n'
              '                long gateNow = System.currentTimeMillis();\n'
              '                if (gateNow - lastNoiseGateDiagnosticAt >= 1000L) {\n'
              '                    lastNoiseGateDiagnosticAt = gateNow;\n'
              '                    Log.d(TAG, "0120 normal gate calibrated="\n'
              '                            + (calibrationFrames >= CALIBRATION_FRAMES)\n'
              '                            + " mode=" + mode + " "\n'
              '                            + activeNoiseGate.diagnosticSummary());\n'
              '                }\n\n'
              '                if (noiseAction == ActiveNoiseAdmissionGate.Action.SUPPRESS) {',
              'normal gate diagnostics')

          replace_once(
              '                        + (outputAudible ? 1 : 0)\n'
              '                        + (adaptiveNoisy ? 1 : 0);',
              '                        + (outputAudible ? 2 : 0)\n'
              '                        + (adaptiveNoisy ? 1 : 0);',
              'barge-in persistence')

          replace_once(
              '                double baseInterrupt = (adaptiveNoisy ? 0.060 : 0.042)\n'
              '                        + suppression * 0.00016\n'
              '                        + (outputAudible ? 0.010 : 0.0)\n'
              '                        + (1.0 - sensitivity) * 0.018\n'
              '                        - sensitivity * 0.006;\n'
              '                double floorMultiplier = (adaptiveNoisy ? 2.15 : 1.70)\n'
              '                        + suppression * 0.006\n'
              '                        + (1.0 - sensitivity) * 0.40;',
              '                double baseInterrupt = (adaptiveNoisy ? 0.068 : 0.050)\n'
              '                        + suppression * 0.00016\n'
              '                        + (outputAudible ? 0.018 : 0.0)\n'
              '                        + (1.0 - sensitivity) * 0.018\n'
              '                        - sensitivity * 0.006;\n'
              '                double floorMultiplier = (adaptiveNoisy ? 2.35 : 1.90)\n'
              '                        + suppression * 0.006\n'
              '                        + (1.0 - sensitivity) * 0.40;',
              'barge-in threshold')

          replace_once(
              '                        && bargeInZcr <= 0.42\n'
              '                        // Very low-frequency wind/engine rumble needs substantially\n'
              '                        // more energy than ordinary speech before it is admitted.\n'
              '                        && !(bargeInZcr < 0.008\n'
              '                            && rms < interruptThreshold * 1.35);',
              '                        && bargeInZcr <= 0.36\n'
              '                        // Very low-frequency wind/engine rumble must look clearly\n'
              '                        // near-field before it can interrupt audible assistant speech.\n'
              '                        && !(bargeInZcr < 0.010\n'
              '                            && rms < interruptThreshold * 1.50);',
              'barge-in discriminator')

          replace_once(
              '                        bargeInGateOpen = true;\n'
              '                        Log.i(TAG, "0101 barge-in gate opened after "\n'
              '                                + consecutiveBargeInFrames + " frames; threshold="\n'
              '                                + interruptThreshold + " rms=" + rms);',
              '                        bargeInGateOpen = true;\n'
              '                        long admissionIndex = ++bargeInAdmissionCount;\n'
              '                        lastBargeInAdmissionAt = System.currentTimeMillis();\n'
              '                        Log.i(TAG, "0120 barge-in ADMIT #" + admissionIndex\n'
              '                                + " reason=PERSISTENT_SPEECH frames=" + consecutiveBargeInFrames\n'
              '                                + " required=" + requiredFrames\n'
              '                                + " rms=" + rms\n'
              '                                + " floor=" + noiseFloor\n'
              '                                + " zcr=" + bargeInZcr\n'
              '                                + " threshold=" + interruptThreshold\n'
              '                                + " outputAudible=" + outputAudible\n'
              '                                + " adaptiveNoisy=" + adaptiveNoisy);',
              'barge-in admit diagnostics')

          replace_once(
              '        if (server.optBoolean("interrupted", false)) {\n'
              '            stopPlayback();',
              '        if (server.optBoolean("interrupted", false)) {\n'
              '            long interruptedIndex = ++serverInterruptedCount;\n'
              '            long sinceBargeInMs = lastBargeInAdmissionAt <= 0L\n'
              '                    ? -1L : Math.max(0L,\n'
              '                        System.currentTimeMillis() - lastBargeInAdmissionAt);\n'
              '            Log.w(TAG, "0120 serverContent.interrupted #" + interruptedIndex\n'
              '                    + " aiSpeaking=" + aiSpeaking\n'
              '                    + " allowVoiceInterruption=" + allowVoiceInterruption\n'
              '                    + " sinceBargeInAdmitMs=" + sinceBargeInMs\n'
              '                    + " outputState=" + lastAudioOutputState);\n'
              '            stopPlayback();',
              'server interrupted diagnostics')

          new_write = r'''    private void writeAudioChunk(byte[] pcm) {
              if (pcm == null || pcm.length == 0 || interruptedCurrentTurn || agentMuted) return;
              int totalWritten = 0;
              int writeError = 0;
              synchronized (playerLock) {
                  if (player != null && player.getPlayState() != AudioTrack.PLAYSTATE_PLAYING) {
                      try {
                          player.play();
                      } catch (Exception playError) {
                          audioTrackWriteFailureCount++;
                          lastAudioOutputState = "AUDIOTRACK_PLAY_FAILED";
                          Log.w(TAG, "0120 AudioTrack play failed #"
                                  + audioTrackWriteFailureCount + " exception="
                                  + playError.getClass().getSimpleName());
                      }
                  }
                  if (player == null) {
                      writeError = AudioTrack.ERROR_INVALID_OPERATION;
                  } else {
                      while (totalWritten < pcm.length) {
                          int remaining = pcm.length - totalWritten;
                          int written = player.write(pcm, totalWritten, remaining);
                          if (written < 0) {
                              writeError = written;
                              break;
                          }
                          if (written == 0) break;
                          if (written < remaining) audioTrackShortWriteCount++;
                          totalWritten += written;
                      }
                  }
              }
              if (writeError < 0) {
                  audioTrackWriteFailureCount++;
                  lastAudioOutputState = "AUDIOTRACK_WRITE_FAILED:" + writeError;
                  Log.w(TAG, "0120 AudioTrack write failed #"
                          + audioTrackWriteFailureCount + " code=" + writeError
                          + " shortWrites=" + audioTrackShortWriteCount
                          + "; rebuilding track");
                  recoverAudioPlayer();
              } else if (totalWritten < pcm.length) {
                  audioTrackShortWriteCount++;
                  lastAudioOutputState = "AUDIOTRACK_SHORT_WRITE:"
                          + totalWritten + "/" + pcm.length;
                  Log.w(TAG, "0120 AudioTrack short write #"
                          + audioTrackShortWriteCount + " bytes="
                          + totalWritten + "/" + pcm.length);
              } else if (totalWritten > 0) {
                  lastAudioOutputState = "AUDIOTRACK_PLAYING";
              }
          }'''
          regex_once(
              r'    private void writeAudioChunk\(byte\[] pcm\) \{.*?\n    \}\n\n    private void recoverAudioPlayer\(\) \{',
              new_write + '\n\n    private void recoverAudioPlayer() {',
              'AudioTrack write method')

          replace_once(
              '        if (usingOboeOutput) {\n'
              '            NativeOboeOutput.write(pcm);\n'
              '            audioPcmBytesAccepted += pcm.length;\n'
              '            lastAudioOutputState = "OBOE_ACCEPTED";\n'
              '            return true;\n'
              '        }',
              '        if (usingOboeOutput) {\n'
              '            try {\n'
              '                NativeOboeOutput.write(pcm);\n'
              '                audioPcmBytesAccepted += pcm.length;\n'
              '                lastAudioOutputState = "OBOE_ACCEPTED";\n'
              '                return true;\n'
              '            } catch (Throwable writeError) {\n'
              '                oboeWriteFailureCount++;\n'
              '                lastAudioOutputState = "OBOE_WRITE_FAILED";\n'
              '                Log.w(TAG, "0120 Oboe write failed #" + oboeWriteFailureCount\n'
              '                        + " exception=" + writeError.getClass().getSimpleName());\n'
              '                return false;\n'
              '            }\n'
              '        }',
              'Oboe write diagnostics')

          replace_once(
              '            // Keep the first 0.8 s as a passive acoustic baseline for diagnostics.\n'
              '            // 0097 intentionally still sends these frames upstream: server VAD owns\n'
              '            // speech-start detection, so Runtime must not eat the user\'s first word.',
              '            // Keep the first 0.8 s as an acoustic baseline. The local\n'
              '            // ActiveNoiseAdmissionGate now protects these uncalibrated frames too;\n'
              '            // its 240 ms pre-roll preserves the first word once speech is confirmed.',
              'startup gate comment')

          path.write_text(text)
          PY

      - name: Commit focused source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/crewpocket/helper/NativeGeminiLiveClient.java
          git commit -m "[audio-patch-bot] Diagnose and harden Gemini Live audio gates"
          git push origin HEAD:${GITHUB_REF_NAME}

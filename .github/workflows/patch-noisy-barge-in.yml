name: Apply noisy barge-in patch

on:
  push:
    branches:
      - fix/noisy-barge-in-speech-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[barge-in-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/noisy-barge-in-speech-gate

      - name: Patch playback barge-in admission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/crewpocket/helper/NativeGeminiLiveClient.java')
          text = path.read_text()
          marker = '0119 noisy barge-in speech discriminator'
          if marker in text:
              raise SystemExit(0)

          i16 = ' ' * 16
          i24 = ' ' * 24
          i28 = ' ' * 28

          replacements = [
              (
                  'double sensitivity = interruptionSensitivity / 100.0;\n'
                  + i16 + 'int requiredFrames = 4\n'
                  + i24 + '+ (int) Math.round((1.0 - sensitivity) * 3.0)\n'
                  + i24 + '+ (outputAudible ? 1 : 0);',
                  'double sensitivity = interruptionSensitivity / 100.0;\n'
                  + i16 + '// 0119 noisy barge-in speech discriminator: auto mode becomes\n'
                  + i16 + '// deliberately more conservative once the calibrated ambient floor\n'
                  + i16 + '// is clearly outdoors/noisy. This affects assistant-playback barge-in\n'
                  + i16 + '// only; normal listening keeps the existing ActiveNoiseAdmissionGate.\n'
                  + i16 + 'boolean adaptiveNoisy = "noisy".equals(mode)\n'
                  + i24 + '|| ("auto".equals(mode) && noiseFloor >= 0.035);\n'
                  + i16 + 'int requiredFrames = 4\n'
                  + i24 + '+ (int) Math.round((1.0 - sensitivity) * 3.0)\n'
                  + i24 + '+ (outputAudible ? 1 : 0)\n'
                  + i24 + '+ (adaptiveNoisy ? 1 : 0);',
                  'speech setup'
              ),
              (
                  'double baseInterrupt = ("noisy".equals(mode) ? 0.060 : 0.042)',
                  'double baseInterrupt = (adaptiveNoisy ? 0.060 : 0.042)',
                  'base threshold'
              ),
              (
                  'double floorMultiplier = ("noisy".equals(mode) ? 2.15 : 1.70)',
                  'double floorMultiplier = (adaptiveNoisy ? 2.15 : 1.70)',
                  'floor multiplier'
              ),
              (
                  'double interruptThreshold = Math.max(\n'
                  + i24 + 'baseInterrupt, noiseFloor * floorMultiplier);\n\n'
                  + i16 + 'if (rms >= interruptThreshold) {',
                  'double interruptThreshold = Math.max(\n'
                  + i24 + 'baseInterrupt, noiseFloor * floorMultiplier);\n\n'
                  + i16 + 'double bargeInZcr = calculateZeroCrossingRate(pcm, count);\n'
                  + i16 + 'boolean speechLikeBargeIn = rms >= interruptThreshold\n'
                  + i24 + '// Strong high-frequency hiss / sharp street texture is\n'
                  + i24 + '// unlikely to be a nearby human interruption.\n'
                  + i24 + '&& bargeInZcr <= 0.42\n'
                  + i24 + '// Very low-frequency wind/engine rumble needs substantially\n'
                  + i24 + '// more energy than ordinary speech before it is admitted.\n'
                  + i24 + '&& !(bargeInZcr < 0.008\n'
                  + i28 + '&& rms < interruptThreshold * 1.35);\n\n'
                  + i16 + 'if (speechLikeBargeIn) {',
                  'speech classifier'
              ),
          ]

          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'{label} block not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/crewpocket/helper/NativeGeminiLiveClient.java
          git commit -m "fix: filter noisy playback barge-in [barge-in-patched]"
          git push origin HEAD:fix/noisy-barge-in-speech-gate

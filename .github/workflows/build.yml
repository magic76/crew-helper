name: Android CI / CD Build

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default is `tools platform-tools`. The legacy
          # `tools` package was removed from the current SDK repository and
          # now makes sdkmanager fail before Gradle can even start.
          packages: ''

      - name: Run Shared Agent Harness Tests
        run: gradle :agent-core:test

      - name: Run Agent Runtime Replay Tests
        run: |
          chmod +x scripts/run_agent_runtime_tests.sh
          ./scripts/run_agent_runtime_tests.sh

      - name: Build with Gradle
        run: gradle assembleRelease bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewHelper-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: CrewHelper-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
